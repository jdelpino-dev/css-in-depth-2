<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letters</title>
  <style>
    *,
    ::before,
    ::after {
      box-sizing: border-box;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 2fr 2fr;
      grid-template-rows: 1fr 1.2fr 1.2fr;
      gap: 0.6em 0.2em;
    }

    .grid>* {
      background-color: darkgray;
      color: white;
      padding: 2em;
      border-radius: 0.5em;
    }
  </style>
</head>

<body>
  <div class="grid">
    <div class="a">a</div>
    <div class="b">b</div>
    <div class="c">c</div>
    <div class="d">d</div>
    <div class="e">e</div>
    <div class="f">f</div>
    <div class="g">g</div>
    <div class="h">h</div>
    <div class="i">i</div>
  </div>
</body>

</html>
